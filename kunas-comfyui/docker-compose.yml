version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: kunas-comfyui_server_1
      APP_PORT: 8188
      PROXY_AUTH_ADD: "false"

  server:
    image: yanwk/comfyui-boot:cu126-slim
    init: true
    restart: on-failure
    runtime: nvidia
    environment:
      CLI_ARGS: "--listen 0.0.0.0 --port 8188"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Mount the image's whole /root workspace. Mounting individual
      # /root/ComfyUI subdirectories on a fresh install creates a partial
      # /root/ComfyUI directory before the boot image can clone ComfyUI, which
      # makes startup fail with: destination path 'ComfyUI' already exists.
      - ${APP_DATA_DIR}/storage:/root
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
