services:
  app_proxy:
    environment:
      # Browser-facing CORS proxy; the Whisper API remains private to this stack.
      APP_HOST: kunas-whisper_web_1
      APP_PORT: 8080
      # API clients authenticate with the generated Umbrel app password.
      PROXY_AUTH_ADD: "false"

  server:
    image: hwdsl2/whisper-server@sha256:1751ee8c3c889482d0bdd1d91a42511be4a1156d9a905e860b56b474675f9d72
    init: true
    restart: unless-stopped
    environment:
      WHISPER_PORT: "9000"
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_THREADS: ${WHISPER_THREADS:-8}
      WHISPER_BEAM: ${WHISPER_BEAM:-5}
      WHISPER_MAX_UPLOAD_MB: ${WHISPER_MAX_UPLOAD_MB:-1024}
      WHISPER_WORD_TIMESTAMPS: ${WHISPER_WORD_TIMESTAMPS:-false}
      WHISPER_DIARIZATION: ${WHISPER_DIARIZATION:-false}
      WHISPER_DIARIZE_NUM_SPEAKERS: ${WHISPER_DIARIZE_NUM_SPEAKERS:--1}
      WHISPER_API_KEY: ${APP_PASSWORD:?Umbrel must provide APP_PASSWORD}
      WHISPER_LOG_LEVEL: INFO
      WHISPER_DISABLE_USAGE_COUNTS: "1"
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/data:/var/lib/whisper
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    user: "101:101"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/nginx.conf <<'EOF'
        pid /tmp/nginx.pid;
        events {}
        http {
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;
          server {
            listen 8080;
            server_name _;
            client_max_body_size 0;
            add_header Access-Control-Allow-Origin "$$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Vary "Origin" always;
            if ($$request_method = OPTIONS) { return 204; }
            location / {
              proxy_pass http://kunas-whisper_server_1:9000;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_request_buffering off;
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
            }
          }
        }
        EOF
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
