manifestVersion: 1
id: kunas-kokoro-fastapi
name: Kokoro GPU
tagline: An intelligent, high-quality TTS solution with NVIDIA GPU acceleration
icon: https://getumbrel.github.io/umbrel-apps-gallery/kokoro/icon.svg
category: ai
version: "0.8.2-gpu-5"
# Keep this outside umbrelOS 2.0's 40000-49999 Machines reserved range.
port: 28880
path: /web/
description: >-
  Kokoro FastAPI is a Dockerized OpenAI-compatible text-to-speech API for
  Kokoro-82M. This package uses an NVIDIA GPU image pinned to a CUDA 12.4-compatible
  Kokoro FastAPI release so compatible Umbrel hosts can accelerate speech
  generation with CUDA.

  The web player is available at /web/ and API documentation is available at
  /docs. The API exposes the OpenAI-compatible speech endpoint
  /v1/audio/speech, making it suitable for apps like Open WebUI that can
  connect to an OpenAI-compatible TTS provider.

developer: remsky
website: https://github.com/remsky/Kokoro-FastAPI
submitter: 9vibes
submission: https://github.com/9vibes/KNS-Umbrel
repo: https://github.com/remsky/Kokoro-FastAPI
support: https://github.com/remsky/Kokoro-FastAPI/issues
gallery:
  - https://getumbrel.github.io/umbrel-apps-gallery/kokoro/1.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/kokoro/2.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/kokoro/3.jpg
releaseNotes: |-
  What's new in 0.8.2-gpu-5

  - Renames the community app to Kokoro GPU.
  - Uses the icon and gallery images from the Kokoro Umbrel App Store submission.
  - Opens the Umbrel app tile directly to Kokoro's /web/ player.
  - Pins the runtime image to Kokoro FastAPI v0.1.4 for NVIDIA GPU acceleration on hosts whose drivers do not satisfy CUDA 12.6+ images.
  - Exposes the OpenAI-compatible TTS API through Umbrel's app proxy.
