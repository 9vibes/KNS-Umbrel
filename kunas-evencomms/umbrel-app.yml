releaseNotes: |-
  Published from source v0.4.3 (80b5dea3e5c09372641601cfbff0ae8f0a60da09).
  Both images are digest-pinned to the verified release. CI, container checks
  and in-place upgrades through 0.4.2 passed.

  0.4.3 fixes the server-side origin rejection seen when the installed Even
  companion runs at http://127.0.0.1:<port>. HTTP health checks, pairing and
  wearer WebSockets now share the same localhost policy, including valid
  port changes. Pairing codes and bearer-token authentication remain required.

  This Umbrel package enables ALLOW_EVEN_LOCALHOST by default. It trusts apps
  served at that exact HTTP loopback address on the client device, not only
  Even. Set it to false to require exact entries in ALLOWED_ORIGINS. Other
  hosts, null origins and malformed ports are not automatically allowed.
  Keep your existing public HTTPS origin in ALLOWED_ORIGINS.

  Update in place; do not uninstall. Existing conversations, wearer pairings,
  model cache, settings, app password and private service token are preserved.
  No new ports, volumes or services are introduced. The 0.4.2 Codex fixes and
  pinned Codex 0.157.1 runtime remain. After updating, retry Check connection
  and pair inside the installed Even app. Physical G2 message delivery and
  actual phone port changes still need device verification.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: STREAM_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable authenticated STREAM preview. False denies media authentication/playback but does not unpublish RTMP or disconnect an already accepted publisher; stop MediaMTX and block ingest when necessary.
  - name: PUBLIC_HOST
    services: [server]
    default: umbrel.local
    note: Encoder-reachable LAN/VPN hostname or IP, without scheme, port or path. Compose falls back to DEVICE_DOMAIN_NAME then umbrel.local only when unset or empty; this nonempty UI default overrides that fallback, so change it for your actual host.
  - name: RTMP_BIND
    services: [mediamtx]
    default: "0.0.0.0"
    note: Host interface for plaintext RTMP. Prefer the host LAN/VPN IP and never router-forward. This must reach Compose interpolation, not just the container environment; recreate MediaMTX and verify the published binding.
  - name: RTMP_PORT
    services: [server, mediamtx]
    default: "21936"
    note: Free host TCP port for RTMP, also advertised to encoders. Must reach Compose interpolation for the port mapping; recreate server and MediaMTX and verify the actual host publication. Still published with STREAM_ENABLED=false.
  - name: COOKIE_SECURE
    services: [server]
    default: "false"
    options: ["true", "false"]
    note: Set true behind trusted HTTPS for Secure playback cookies; false is for isolated HTTP use. Also explicitly allow the HTTPS origin in ALLOWED_ORIGINS.
  - name: ALLOWED_ORIGINS
    services: [server]
    default: ""
    note: Empty uses http://<device-domain>:28097 (umbrel.local fallback). Otherwise supply the complete comma-separated list of exact HTTP(S) origins for browsers and the packaged Even app, with ports when non-default. No paths or wildcards; explicitly include HTTPS behind TLS termination.
  - name: ALLOW_EVEN_LOCALHOST
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Allow installed Even clients at http://127.0.0.1 with any valid explicit port for CORS and wearer WebSockets. Trusts any app served at that local address; pairing and bearer tokens remain required. Set false to require exact ALLOWED_ORIGINS entries instead.
  - name: STT_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable local English CPU transcription. Set false for text-only use.
  - name: STT_MODEL
    services: [server]
    default: base.en
    note: Faster Whisper model name or a model directory inside the container. First download needs Internet access; cached models persist in /data/models. Hardware capacity is unverified.
  - name: STT_TIMEOUT
    services: [server]
    default: "90"
    note: Positive finite transcription timeout in seconds. A cold download/load can exceed it; the worker remains busy until completion. Wait, then explicitly retry failed transcription.
  - name: OLLAMA_URL
    services: [server]
    default: ""
    note: Empty disables AI suggestions. To enable, supply a Docker-reachable trusted local Ollama base URL, not /api/chat. No Ollama installation or model download is performed.
  - name: OLLAMA_MODEL
    services: [server]
    default: llama3.2:3b
    note: Model already installed on the configured Ollama server; it is not pulled automatically. An empty model also disables suggestions. The operator must review and send replies.
  - name: OLLAMA_TIMEOUT
    services: [server]
    default: "30"
    note: Positive finite suggestion timeout in seconds. Manual replies remain available if Ollama fails.
  - name: OPENAI_TIMEOUT
    services: [server]
    default: "90"
    note: Optional nonsecret Research provider timeout in seconds, 1..110. Use HTTPS in-app Key Connect for a current-sign-in key; no API key is collected by this form.
  - name: OPENAI_MAX_OUTPUT_TOKENS
    services: [server]
    default: "2048"
    note: Optional nonsecret Research output token cap, integer 256..8192. OpenAI API usage is billable; model availability does not guarantee image or Responses support.
  - name: MAX_SESSIONS
    services: [server]
    default: "100"
    note: Positive integer limit on stored conversations, not a hardware capacity or retention guarantee.
  - name: MAX_MESSAGES_PER_SESSION
    services: [server]
    default: "1000"
    note: Positive integer limit on stored messages per conversation, not a timed deletion policy.
