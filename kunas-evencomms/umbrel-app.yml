releaseNotes: |-
  0.4.1 fixes Codex device-code login on the normal HTTP Umbrel console. Both
  published images are digest-pinned and complete anonymous downloads were
  checksum-verified. Source: 11521b18fc4c070c4e0420b462141541396258e6, tagged v0.4.1.

  Fixes 0.4.0's disabled Codex login on Umbrel HTTP. Get Codex login code now asks
  for trusted-network confirmation before each non-loopback HTTP login POST.
  HTTPS is strongly recommended: operator sessions, codes and chat can be intercepted.
  API-key entry still requires HTTPS or exact localhost/loopback. Keep Secure
  playback cookies off on HTTP; enable only after configuring trusted HTTPS.

  OpenAI-issued nine-digit and other supported codes are displayed unchanged; enter
  them at https://auth.openai.com/codex/device, as with codex login --device-auth.
  Codes are never generated locally; a separate CLI login does not connect the app.
  OpenAI may require enabling device-code authentication in ChatGPT security settings.

  Independent 10-second binary verification preserves login readiness if the
  75-second generation proof fails or times out; generation stays blocked.
  Overlapping heartbeat/login acknowledgements no longer accidentally cancel
  unacknowledged sessions or lose their cleanup obligations.

  Update both images in place, never uninstall. Preserve data/models, settings,
  app ID/password and the existing private codex-auth/token without rotation:
  ownership 10001:10002, directory 0750, file 0440. No new secret, directory,
  port or deployment setting is needed for a 0.4.0 upgrade.

  Official Codex 0.157.1 and its binary hashes are unchanged, as are two operators/
  eight requests per login, RAM-only OAuth and no automatic paid API/model/provider
  fallback. CI/release run 36308059105 passed: 1095 tests (1054 backend including
  the dedicated native login test, 27 frontend and 14 browser), exact-image
  container isolation/readiness, playback/capture, CPU transcription and upgrades
  from 0.1.0, 0.2.1, 0.3.0 and 0.4.0. The 0.4.0 old-to-new initializer check preserved
  private token bytes and permissions. The pinned binary exercised the production
  login handler with a synthetic nine-digit code and delayed approval, not a real
  OpenAI account. All five v0.4.1 icon/gallery URLs were verified.
  Real accounts, physical G2/phones, Safari and actual Umbrel/Stone installation
  remain unverified. The four gallery images reuse synthetic API-mode content.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: STREAM_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable authenticated STREAM preview. False denies media authentication/playback but does not unpublish RTMP or disconnect an already accepted publisher; stop MediaMTX and block ingest when necessary.
  - name: PUBLIC_HOST
    services: [server]
    default: umbrel.local
    note: Encoder-reachable LAN/VPN hostname or IP, without scheme, port or path. Compose falls back to DEVICE_DOMAIN_NAME then umbrel.local only when unset or empty; this nonempty UI default overrides that fallback, so change it for your actual host.
  - name: RTMP_BIND
    services: [mediamtx]
    default: "0.0.0.0"
    note: Host interface for plaintext RTMP. Prefer the host LAN/VPN IP and never router-forward. This must reach Compose interpolation, not just the container environment; recreate MediaMTX and verify the published binding.
  - name: RTMP_PORT
    services: [server, mediamtx]
    default: "21936"
    note: Free host TCP port for RTMP, also advertised to encoders. Must reach Compose interpolation for the port mapping; recreate server and MediaMTX and verify the actual host publication. Still published with STREAM_ENABLED=false.
  - name: COOKIE_SECURE
    services: [server]
    default: "false"
    options: ["true", "false"]
    note: Set true behind trusted HTTPS for Secure playback cookies; false is for isolated HTTP use. Also explicitly allow the HTTPS origin in ALLOWED_ORIGINS.
  - name: ALLOWED_ORIGINS
    services: [server]
    default: ""
    note: Empty uses http://<device-domain>:28097 (umbrel.local fallback). Otherwise supply the complete comma-separated list of exact HTTP(S) origins for browsers and the packaged Even app, with ports when non-default. No paths or wildcards; explicitly include HTTPS behind TLS termination.
  - name: STT_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable local English CPU transcription. Set false for text-only use.
  - name: STT_MODEL
    services: [server]
    default: base.en
    note: Faster Whisper model name or a model directory inside the container. First download needs Internet access; cached models persist in /data/models. Hardware capacity is unverified.
  - name: STT_TIMEOUT
    services: [server]
    default: "90"
    note: Positive finite transcription timeout in seconds. A cold download/load can exceed it; the worker remains busy until completion. Wait, then explicitly retry failed transcription.
  - name: OLLAMA_URL
    services: [server]
    default: ""
    note: Empty disables AI suggestions. To enable, supply a Docker-reachable trusted local Ollama base URL, not /api/chat. No Ollama installation or model download is performed.
  - name: OLLAMA_MODEL
    services: [server]
    default: llama3.2:3b
    note: Model already installed on the configured Ollama server; it is not pulled automatically. An empty model also disables suggestions. The operator must review and send replies.
  - name: OLLAMA_TIMEOUT
    services: [server]
    default: "30"
    note: Positive finite suggestion timeout in seconds. Manual replies remain available if Ollama fails.
  - name: OPENAI_TIMEOUT
    services: [server]
    default: "90"
    note: Optional nonsecret Research provider timeout in seconds, 1..110. Use HTTPS in-app Key Connect for a current-sign-in key; no API key is collected by this form.
  - name: OPENAI_MAX_OUTPUT_TOKENS
    services: [server]
    default: "2048"
    note: Optional nonsecret Research output token cap, integer 256..8192. OpenAI API usage is billable; model availability does not guarantee image or Responses support.
  - name: MAX_SESSIONS
    services: [server]
    default: "100"
    note: Positive integer limit on stored conversations, not a hardware capacity or retention guarantee.
  - name: MAX_MESSAGES_PER_SESSION
    services: [server]
    default: "1000"
    note: Positive integer limit on stored messages per conversation, not a timed deletion policy.
