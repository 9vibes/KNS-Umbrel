releaseNotes: |-
  0.4.0 adds experimental ChatGPT account Research through official Codex 0.157.1
  and an isolated bridge. Both published AMD64 images are pinned to verified
  digests. Their complete anonymous manifest, config and layer downloads were
  checksum-verified against the release artifacts.

  API mode remains the UI default and existing optional OpenAI keys/settings are
  retained. CPU STT, wearer controls, conversations, pairings, human-approved local
  Ollama, API Research, selected stills, 1x-4x digital zoom/pan and LL-HLS remain.
  No recording, transcoding, continuous analysis or automatic replies to glasses.

  The bridge starts idle with synthetic local probes, not real account/inference
  requests. Account use requires explicit Codex choice, device login, model and
  Send, with an eligible ChatGPT plan/workspace. Allowance, purchased credits and
  ChatGPT privacy rules apply, not API store: false. Two signed-in operators and
  eight fresh requests per login bound RAM. OAuth credentials are RAM-only.
  Submitted frames/history remain in ephemeral threads until runtime cleanup.
  No automatic API/model/provider fallback or extra agent loops; the relay allows
  only bounded normal OAuth 401 recovery, not arbitrary generation retries.

  Upgrade from 0.1.0, 0.2.1 or 0.3.0 in place. Stop the
  app and back up all data, SQLite sidecars, pairings, stream keys, model cache,
  settings and the Umbrel password seed. Also privately back up codex-auth if it
  exists and on every subsequent backup. Do not uninstall or replace the app ID.
  Preserve existing user overrides, including explicitly empty settings; test
  custom forks separately. Web port 28097, RTMP 21936, data paths and generated
  password are unchanged. Sign in again after restart; paired wearers reconnect.
  API sign-in keys, Codex OAuth credentials and Research chat are not restored
  from backups. The failed 0.2.0 candidate was never an image/store release.

  Recreate the full stack, including data_init and codex-bridge, using both
  release images. Initialization refreshes image-managed nginx/MediaMTX configs
  and creates a random 64-hex local service token once in private codex-auth/token,
  outside data/config. Valid existing tokens are not rotated. Preserve ownership
  10001:10002, directory 0750 and file 0440 on backup/restore. Only init mounts it
  writable; only backend/bridge mount it read-only. It is not an OpenAI credential,
  and neither init nor bridge receives APP_PASSWORD. The bridge adds no public
  ports and its health does not gate normal startup. Private authenticated /ready
  must prove verified binary, generation enabled and zero idle account sessions.

  WARNING: plaintext RTMP remains published on 0.0.0.0:21936, new for 0.1.0.
  Check the port, prefer RTMP_BIND set to a LAN/VPN IP and never router-forward.
  STREAM_ENABLED=false leaves the port published. LL-HLS retains 200ms parts,
  a 1s HLS.js live target and nginx's 9m Research ceiling, not latency guarantees.
  Remote Codex login needs manually configured HTTPS, COOKIE_SECURE=true and
  explicit ALLOWED_ORIGINS; the ordinary Umbrel HTTP URL is not eligible.

  Source v0.4.0: 3114226dafb049b99228630b32dbf1f638a40e41. All 1071 automated tests
  passed (1031 backend, 27 frontend, 13 browser). Release run 36302687176 passed
  fresh CPU transcription and upgrades from 0.1.0, 0.2.1 and 0.3.0, preserving
  conversations, pairing, model cache and existing stream secrets. Final-image
  playback, zoom and capture passed. The bridge's real binary proof ran without
  external networking under container restrictions; private token provisioning,
  UID permissions, mounts, resource/network controls and authenticated running
  /ready (verified binary, generation enabled, zero account sessions) passed.

  All five v0.4.0 icon/gallery URLs were HTTP-verified. Gallery images retain
  synthetic 0.3.0 content, showing API Research, not a Codex login or fabricated
  successful model answer. Mocks/synthetic tests do not verify real account/device
  login, inference, model entitlement, tenant routing, billing or retention.
  Physical G2/phones, native Safari and the actual Umbrel host/proxy/TLS path still
  need acceptance testing. Publication is not installation on an actual Umbrel host.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: STREAM_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable authenticated STREAM preview. False denies media authentication/playback but does not unpublish RTMP or disconnect an already accepted publisher; stop MediaMTX and block ingest when necessary.
  - name: PUBLIC_HOST
    services: [server]
    default: umbrel.local
    note: Encoder-reachable LAN/VPN hostname or IP, without scheme, port or path. Compose falls back to DEVICE_DOMAIN_NAME then umbrel.local only when unset or empty; this nonempty UI default overrides that fallback, so change it for your actual host.
  - name: RTMP_BIND
    services: [mediamtx]
    default: "0.0.0.0"
    note: Host interface for plaintext RTMP. Prefer the host LAN/VPN IP and never router-forward. This must reach Compose interpolation, not just the container environment; recreate MediaMTX and verify the published binding.
  - name: RTMP_PORT
    services: [server, mediamtx]
    default: "21936"
    note: Free host TCP port for RTMP, also advertised to encoders. Must reach Compose interpolation for the port mapping; recreate server and MediaMTX and verify the actual host publication. Still published with STREAM_ENABLED=false.
  - name: COOKIE_SECURE
    services: [server]
    default: "false"
    options: ["true", "false"]
    note: Set true behind trusted HTTPS for Secure playback cookies; false is for isolated HTTP use. Also explicitly allow the HTTPS origin in ALLOWED_ORIGINS.
  - name: ALLOWED_ORIGINS
    services: [server]
    default: ""
    note: Empty uses http://<device-domain>:28097 (umbrel.local fallback). Otherwise supply the complete comma-separated list of exact HTTP(S) origins for browsers and the packaged Even app, with ports when non-default. No paths or wildcards; explicitly include HTTPS behind TLS termination.
  - name: STT_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable local English CPU transcription. Set false for text-only use.
  - name: STT_MODEL
    services: [server]
    default: base.en
    note: Faster Whisper model name or a model directory inside the container. First download needs Internet access; cached models persist in /data/models. Hardware capacity is unverified.
  - name: STT_TIMEOUT
    services: [server]
    default: "90"
    note: Positive finite transcription timeout in seconds. A cold download/load can exceed it; the worker remains busy until completion. Wait, then explicitly retry failed transcription.
  - name: OLLAMA_URL
    services: [server]
    default: ""
    note: Empty disables AI suggestions. To enable, supply a Docker-reachable trusted local Ollama base URL, not /api/chat. No Ollama installation or model download is performed.
  - name: OLLAMA_MODEL
    services: [server]
    default: llama3.2:3b
    note: Model already installed on the configured Ollama server; it is not pulled automatically. An empty model also disables suggestions. The operator must review and send replies.
  - name: OLLAMA_TIMEOUT
    services: [server]
    default: "30"
    note: Positive finite suggestion timeout in seconds. Manual replies remain available if Ollama fails.
  - name: OPENAI_TIMEOUT
    services: [server]
    default: "90"
    note: Optional nonsecret Research provider timeout in seconds, 1..110. Use HTTPS in-app Key Connect for a current-sign-in key; no API key is collected by this form.
  - name: OPENAI_MAX_OUTPUT_TOKENS
    services: [server]
    default: "2048"
    note: Optional nonsecret Research output token cap, integer 256..8192. OpenAI API usage is billable; model availability does not guarantee image or Responses support.
  - name: MAX_SESSIONS
    services: [server]
    default: "100"
    note: Positive integer limit on stored conversations, not a hardware capacity or retention guarantee.
  - name: MAX_MESSAGES_PER_SESSION
    services: [server]
    default: "1000"
    note: Positive integer limit on stored messages per conversation, not a timed deletion policy.
