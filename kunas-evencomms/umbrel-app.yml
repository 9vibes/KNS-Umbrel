# EVENCOMMS 0.4.6 Research interface cleanup.
manifestVersion: 1
id: kunas-evencomms
name: EVENCOMMS
tagline: Live comms, stream monitoring and visual research
icon: https://raw.githubusercontent.com/9vibes/EVENCOMMS/v0.4.6/assets/icon.svg
category: social
version: "0.4.6"
port: 28097
description: >-
  EVENCOMMS connects an Even Hub companion with a browser operator for local
  conversations. Short English speech is transcribed locally on CPU. Operators
  review and send replies; optional local Ollama suggestions require human approval.
  The phone companion is installed separately through Even Hub.


  STREAM previews an authenticated RTMP feed over low-latency HLS, with 1x-4x
  digital zoom and still-frame capture. There is no recording, transcoding or
  continuous video analysis. Plaintext RTMP uses port 21936 on a trusted LAN/VPN.


  RESEARCH uses ChatGPT code login through the isolated Codex 0.157.1 runtime.
  Replies appear as they are generated. Select a model and explicitly Send to
  submit the displayed conversation and reviewed still frames. No continuous
  video/audio or unsent wearer drafts are sent, and Research never automatically
  replies to the glasses. No API key entry, paid API fallback or web-search tools.
  An eligible ChatGPT plan is required; account usage limits and data controls apply.
  OAuth credentials stay in bridge memory until disconnect, expiry or restart.


  The operator reply preview matches the companion's green-on-black glasses display.
  Research history and drafts remain in browser memory. Submitted messages and
  frames remain in temporary Codex threads until runtime cleanup. Sent wearer and
  operator conversations persist locally in SQLite. The first speech transcription
  downloads a model, which is cached for later use.


  Linux x86-64 only. Sign in with Umbrel's generated app password; no username.
  Use trusted networking and HTTPS for private conversations and phone deployment.
  Device login on the normal Umbrel HTTP URL requires trusted-network confirmation;
  OpenAI sign-in uses its HTTPS device page. The store screenshots are illustrative
  synthetic examples from an earlier version, not evidence of hardware testing.
developer: 9vibes
website: https://github.com/9vibes/EVENCOMMS
submitter: 9vibes
submission: https://github.com/9vibes/KNS-Umbrel
repo: https://github.com/9vibes/EVENCOMMS
support: https://github.com/9vibes/EVENCOMMS/issues
gallery:
  - https://raw.githubusercontent.com/9vibes/EVENCOMMS/v0.4.6/assets/screenshot-operator.png
  - https://raw.githubusercontent.com/9vibes/EVENCOMMS/v0.4.6/assets/screenshot-wearer.png
  - https://raw.githubusercontent.com/9vibes/EVENCOMMS/v0.4.6/assets/screenshot-stream.png
  - https://raw.githubusercontent.com/9vibes/EVENCOMMS/v0.4.6/assets/screenshot-research.png
releaseNotes: |-
  Removes redundant device-code explanation text from the Research tab.
  Code login, model selection, streaming replies and the glasses-style operator
  reply preview remain unchanged.

  Update the server and bridge together in place. Existing conversations,
  settings, app password, model cache and private service token are preserved.
  Reconnect ChatGPT after updating. No new ports, services or permissions.
  The separately installed phone companion does not need reinstallation.

dependencies: []
path: ""
deterministicPassword: true
defaultUsername: ""
environment:
  - name: STREAM_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable authenticated STREAM preview. False denies media authentication/playback but does not unpublish RTMP or disconnect an already accepted publisher; stop MediaMTX and block ingest when necessary.
  - name: PUBLIC_HOST
    services: [server]
    default: umbrel.local
    note: Encoder-reachable LAN/VPN hostname or IP, without scheme, port or path. Compose falls back to DEVICE_DOMAIN_NAME then umbrel.local only when unset or empty; this nonempty UI default overrides that fallback, so change it for your actual host.
  - name: RTMP_BIND
    services: [mediamtx]
    default: "0.0.0.0"
    note: Host interface for plaintext RTMP. Prefer the host LAN/VPN IP and never router-forward. This must reach Compose interpolation, not just the container environment; recreate MediaMTX and verify the published binding.
  - name: RTMP_PORT
    services: [server, mediamtx]
    default: "21936"
    note: Free host TCP port for RTMP, also advertised to encoders. Must reach Compose interpolation for the port mapping; recreate server and MediaMTX and verify the actual host publication. Still published with STREAM_ENABLED=false.
  - name: COOKIE_SECURE
    services: [server]
    default: "false"
    options: ["true", "false"]
    note: Set true behind trusted HTTPS for Secure playback cookies; false is for isolated HTTP use. Also explicitly allow the HTTPS origin in ALLOWED_ORIGINS.
  - name: ALLOWED_ORIGINS
    services: [server]
    default: ""
    note: Empty uses http://<device-domain>:28097 (umbrel.local fallback). Otherwise supply the complete comma-separated list of exact HTTP(S) origins for browsers and the packaged Even app, with ports when non-default. No paths or wildcards; explicitly include HTTPS behind TLS termination.
  - name: ALLOW_EVEN_LOCALHOST
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Allow installed Even clients at http://127.0.0.1 with any valid explicit port for CORS and wearer WebSockets. Trusts any app served at that local address; pairing and bearer tokens remain required. Set false to require exact ALLOWED_ORIGINS entries instead.
  - name: STT_ENABLED
    services: [server]
    default: "true"
    options: ["true", "false"]
    note: Enable local English CPU transcription. Set false for text-only use.
  - name: STT_MODEL
    services: [server]
    default: base.en
    note: Faster Whisper model name or a model directory inside the container. First download needs Internet access; cached models persist in /data/models. Hardware capacity is unverified.
  - name: STT_TIMEOUT
    services: [server]
    default: "90"
    note: Positive finite transcription timeout in seconds. A cold download/load can exceed it; the worker remains busy until completion. Wait, then explicitly retry failed transcription.
  - name: OLLAMA_URL
    services: [server]
    default: ""
    note: Empty disables AI suggestions. To enable, supply a Docker-reachable trusted local Ollama base URL, not /api/chat. No Ollama installation or model download is performed.
  - name: OLLAMA_MODEL
    services: [server]
    default: llama3.2:3b
    note: Model already installed on the configured Ollama server; it is not pulled automatically. An empty model also disables suggestions. The operator must review and send replies.
  - name: OLLAMA_TIMEOUT
    services: [server]
    default: "30"
    note: Positive finite suggestion timeout in seconds. Manual replies remain available if Ollama fails.
  - name: OPENAI_TIMEOUT
    services: [server]
    default: "90"
    note: Optional nonsecret Research provider timeout in seconds, 1..110. Code-login Research uses this deadline; no API key is collected by this form.
  - name: OPENAI_MAX_OUTPUT_TOKENS
    services: [server]
    default: "2048"
    note: Legacy API endpoint output cap, integer 256..8192; does not apply to code-login Research.
  - name: MAX_SESSIONS
    services: [server]
    default: "100"
    note: Positive integer limit on stored conversations, not a hardware capacity or retention guarantee.
  - name: MAX_MESSAGES_PER_SESSION
    services: [server]
    default: "1000"
    note: Positive integer limit on stored messages per conversation, not a timed deletion policy.
