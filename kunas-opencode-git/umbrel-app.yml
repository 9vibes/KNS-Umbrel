manifestVersion: 1
id: kunas-opencode-git
name: OpenCode Git
tagline: OpenCode AI coding agent with Git installed for repository actions
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/opencode/icon.svg
category: ai
version: "1.18.29-git-1"
# Keep this outside umbrelOS 2.0's 40000-49999 Machines reserved range.
port: 28096
description: >-
  OpenCode Git is a KUNAS-packaged OpenCode server image with git and OpenSSH
  client tools installed inside the container, so repository-aware chat and
  coding actions can inspect commits, diffs, branches, and project history.


  This package persists OpenCode data under the Umbrel app data directory and
  exposes your Umbrel Documents folder at /9Vibes Stuff via Umbrel custom mounts.
  It also seeds first-run configuration for the local Ollama model
  local-ollama/qwen3.6:35b when no OpenCode config already exists.


  Based on OpenCode 1.18.29.
developer: Anomaly / 9vibes
website: https://opencode.ai/
submitter: 9vibes
submission: https://github.com/9vibes/KNS-Umbrel
repo: https://github.com/anomalyco/opencode
support: https://github.com/anomalyco/opencode/issues
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/opencode/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/opencode/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/opencode/3.jpg
releaseNotes: |-
  What's new in 1.18.29-git-1

  - Adds a KUNAS OpenCode package based on OpenCode 1.18.29.
  - Uses a custom GHCR image with git, OpenSSH client, and CA certificates installed inside the OpenCode container.
  - Seeds local Ollama configuration for local-ollama/qwen3.6:35b on first run.
  - Mounts Umbrel Documents at /9Vibes Stuff for project access.
path: ""
defaultUsername: ""
defaultPassword: ""
