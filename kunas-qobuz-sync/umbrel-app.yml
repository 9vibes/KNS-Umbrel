manifestVersion: 1
id: kunas-qobuz-sync
name: Qobuz Sync
tagline: Monitor purchased albums and tracks, sync them to your Umbrel Downloads/QobuzSync folder, and keep artwork, and metadata in one place for Navidrome or your preferred music server to digest.
icon: https://raw.githubusercontent.com/9vibes/QobuzSync/main/assets/icon.svg
category: media
version: "0.1.54"
# Keep this outside umbrelOS 2.0's 40000-49999 Machines reserved range.
port: 28080
description: >-
  Qobuz Sync monitors your Qobuz account for purchased albums and tracks, then downloads newly discovered purchases to your Umbrel Downloads/QobuzSync folder.


  Open the app after installation to paste your Qobuz Web Player browser session or auth token, choose a quality level, set a sync interval and enjoy.


  This app is intended only for archiving music you have purchased from your own Qobuz account. It is not affiliated with Qobuz.


  Release history:
  - 0.1.54: Fixes remaining Save settings origin rejections with HTTPS reverse proxies, missing forwarded schemes, and IPv6 hosts.
  - 0.1.53: Fixes Qobuz browser-session paste behind Umbrel/reverse proxies and accepts full Local Storage row copies.
  - 0.1.52: Faster local-only dashboard updates, safer non-destructive resync, reliable album downloads, MP3 support, and security fixes.
  - 0.1.51: Removes the broken Qobuz email/password login method and requires Qobuz Web Player session/token login.
  - 0.1.50: Removes the dashboard security notice and switches the container to the randomized 0.1.48 web port.
  - 0.1.49: Publishes the security-hardened 0.1.47 container (opt-in dashboard auth, CSRF protection, credential redaction, sync-lock fixes).
  - 0.1.48: Switches the Umbrel package to the newly published ghcr.io/9vibes/qobuzsync:0.1.46 image.
  - 0.1.47: Updates App Store metadata to use the new 9vibes/QobuzSync source repository while keeping the current published container image.
  - 0.1.46: Publishes the live page refresh update under a fresh Umbrel-visible version and points the package at the 0.1.46 image.
  - 0.1.45: Adds live page refreshes for progress, counters, recent downloads, last sync, and status badge, and softens the hero card corner flare.
  - 0.1.44: Simplifies Qobuz Web Player token instructions and removes the Downloads path note from the settings help.
  - 0.1.43: Clears stale completed track-progress rows so tracks no longer remain stuck as Writing to disk.
  - 0.1.42: Adds artwork to active progress track cards and puts them ahead of older recent downloads.
  - 0.1.41: Integrates track progress into each Library track card and keeps one master progress bar under Sync status.
  - 0.1.40: Moves download progress bars into Sync status, replacing the old yellow overall progress bar.
  - 0.1.37: Shows the recent changelog directly in the App Store description so it is visible even when Umbrel does not surface release notes.
  - 0.1.36: Security hardening for credential storage and full-library resync cleanup.
  - 0.1.35: Added versioned What's New metadata and durable release history tracking.
developer: 9vibes
website: https://github.com/9vibes/QobuzSync
submitter: 9vibes
submission: https://github.com/9vibes/QobuzSync
repo: https://github.com/9vibes/QobuzSync
support: https://github.com/9vibes/QobuzSync/issues
gallery:
  - https://raw.githubusercontent.com/9vibes/QobuzSync/main/assets/screenshot-library.png
  - https://raw.githubusercontent.com/9vibes/QobuzSync/main/assets/screenshot-settings.png
widgets:
  - id: status
    type: three-stats
    refresh: 30000
    endpoint: server:23809/widget
    link: ""
    example:
      text: All Good!
      items:
        - title: Status
          text: All Good!
        - title: Downloaded
          text: "12"
        - title: Progress
          text: Complete 0/0
releaseNotes: |-
  What's new in 0.1.54

  - Fixes Save settings rejection when a proxy replaces the browser-facing HTTPS scheme with HTTP.
  - Handles forwarded hosts without a forwarded scheme and IPv6 host addresses.
  - Preserves authentication and cross-site request protection. Covers saves with empty fields, manual credentials, and pasted browser sessions.

  Upgrade notes

  - After updating, reload the app page and retry Save settings. Existing saved credentials and downloads are preserved.

  Previous updates

  - 0.1.53: Added forwarded-origin support and full Local Storage row paste support.
  - 0.1.52: Faster local-only dashboard updates, safer non-destructive resync, reliable album downloads, MP3 support, and security fixes.
  - 0.1.51: Removed broken email/password login and retained Qobuz Web Player session/token login.
  - 0.1.50: Removed the dashboard security notice and switched the container to the randomized 0.1.48 web port.
  - 0.1.49: Updated the Umbrel package to the security-hardened ghcr.io/9vibes/qobuzsync:0.1.47 image.
  - 0.1.48: Switched the Umbrel package to the newly published ghcr.io/9vibes/qobuzsync:0.1.46 image.
  - 0.1.46: Published the live-refresh dashboard improvements under a fresh Umbrel-visible package version.
  - 0.1.45: Added lightweight live page refreshes and softened the title card corner flare.
  - 0.1.44: Simplified Qobuz Web Player token instructions in Settings & status.
  - 0.1.43: Cleared stale completed track-progress rows so tracks no longer remain stuck as Writing to disk.
  - 0.1.42: Added artwork to active progress track cards and put them ahead of older recent downloads.
