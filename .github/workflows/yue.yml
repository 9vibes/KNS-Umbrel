name: Build YuE2 GPU image
on:
  push:
    branches: [master]
    paths:
      - 'kunas-yue/**'
      - '.github/workflows/yue.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner space for CUDA dependencies
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test adapter
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-yue
          platforms: linux/amd64
          load: true
          tags: yue:test
          cache-from: type=gha,scope=yue
          cache-to: type=gha,mode=max,scope=yue
      - name: Smoke test HTTP and persistent storage (no model download)
        run: |
          docker run -d --name yue-test -p 127.0.0.1:7860:7860 -v yue-test-data:/data yue:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/ | grep 'Create song'
          docker exec --user 1000:1000 yue-test sh -c 'echo retained > /data/songs/persistence-check'
          docker restart yue-test
          docker exec yue-test test -f /data/songs/persistence-check
      - name: Logs on failure
        if: failure()
        run: docker logs yue-test || true
      - name: Publish tested image
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-yue
          platforms: linux/amd64
          push: true
          tags: ghcr.io/9vibes/kunas-yue:0.1.0
          cache-from: type=gha,scope=yue
