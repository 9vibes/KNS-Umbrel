name: Build Gods Eye View image
on:
  push:
    branches: [master]
    paths:
      - "kunas-gods-eye-view/**"
      - ".github/workflows/gods-eye-view.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image (upstream tests and assets included)
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-gods-eye-view
          load: true
          tags: gev:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise runtime and persistent settings
        run: |
          docker run -d --name gev-test -v gev-test-data:/data gev:test
          docker exec gev-test node /app/umbrel-smoke.mjs save
          docker restart gev-test
          docker exec gev-test node /app/umbrel-smoke.mjs verify
      - name: Runtime logs on failure
        if: failure()
        run: docker logs gev-test || true
      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-gods-eye-view
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/9vibes/kunas-gods-eye-view:0.1.1-umbrel.1
            ghcr.io/9vibes/kunas-gods-eye-view:latest
