name: Build Gods Eye View image
on:
  push:
    branches: [master]
    paths:
      - "kunas-gods-eye-view/**"
      - ".github/workflows/gods-eye-view.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    # Native runners avoid QEMU timing out upstream's 30s launcher tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build test image (upstream tests and assets included)
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-gods-eye-view
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gev:test
          cache-from: type=gha,scope=gev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gev-${{ matrix.arch }}
      - name: Exercise runtime and persistent settings
        run: |
          docker run -d --name gev-test -v gev-test-data:/data gev:test
          docker exec gev-test node /app/umbrel-smoke.mjs save
          docker restart gev-test
          docker exec gev-test node /app/umbrel-smoke.mjs verify
      - name: Runtime logs on failure
        if: failure()
        run: docker logs gev-test || true
      - name: Publish tested architecture by digest
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ./kunas-gods-eye-view
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/9vibes/kunas-gods-eye-view,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=gev-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: gev-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: gev-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/9vibes/kunas-gods-eye-view:0.1.1-umbrel.1 \
            -t ghcr.io/9vibes/kunas-gods-eye-view:latest \
            $(printf 'ghcr.io/9vibes/kunas-gods-eye-view@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/9vibes/kunas-gods-eye-view:0.1.1-umbrel.1
